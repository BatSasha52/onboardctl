name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROMETHEUS_VERSION: 3.16.0
  KUBECONFORM_VERSION: v0.8.0
  SHELLCHECK_VERSION: v0.11.0
  KUBERNETES_VERSION: 1.36.0

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install .
      - name: Install kubeconform and promtool
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          prom="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${prom}.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "${prom}/promtool"
      - name: Render examples and services
        run: onboardctl render examples/api-strict.yaml examples/batch-relaxed.yaml services/ -o rendered --rules-dir rendered/rules
      - name: kubeconform
        # The CRD catalog has schemas for ServiceMonitor, PrometheusRule and AlertmanagerConfig.
        run: |
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            $(find rendered -mindepth 1 -maxdepth 1 -type d ! -name rules)
      - name: promtool check rules
        run: promtool check rules rendered/rules/*.yaml
      - name: promtool test rules
        run: promtool test rules tests/promtool/*.test.yaml

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: shellcheck
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck scripts/*.sh
