# The self-service path: a team opens a pull request that adds or changes a
# spec under services/. The first job validates and renders the changed
# specs and uploads the manifests for reviewers. The second applies every
# spec to a throwaway kind cluster created inside the job and checks that
# onboarding, verification and the DR drill work end to end. That cluster is
# a test fixture, not a platform: nothing here deploys anywhere real.
name: onboarding

on:
  pull_request:
    paths:
      - "services/**"
      - "src/**"
      - "cluster/**"
      - "demo/**"
      - "scripts/dev-cluster.sh"
      - ".github/workflows/onboarding.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "src/**"
      - "cluster/**"
      - "demo/**"
      - "scripts/dev-cluster.sh"
      - ".github/workflows/onboarding.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROMETHEUS_VERSION: 3.16.0
  KUBECONFORM_VERSION: v0.8.0
  KUBECTL_VERSION: v1.36.6
  KIND_VERSION: v0.33.0
  HELM_VERSION: v3.22.1

jobs:
  validate-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install .
      - name: Find changed specs
        id: specs
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only --diff-filter=d "origin/${BASE_REF}...HEAD" -- 'services/*.yaml' 'services/*.yml' > changed.txt
          else
            find services -maxdepth 1 -name '*.y*ml' | sort > changed.txt
          fi
          echo "Specs to check:"; cat changed.txt
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
      - name: Validate all specs together
        # Also catches two specs claiming the same name or namespace.
        run: onboardctl validate services/
      - name: Render changed specs
        if: steps.specs.outputs.count != '0'
        run: xargs -a changed.txt onboardctl render -o rendered --rules-dir rendered/rules
      - name: Install kubeconform and promtool
        if: steps.specs.outputs.count != '0'
        run: |
          # Pinned versions go into a job-local directory placed first on PATH.
          # The runner image already has some of these tools in /usr/local/bin,
          # owned by root, and they cannot be replaced there.
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$bin" kubeconform
          prom="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${prom}.tar.gz" \
            | tar -xz --strip-components=1 -C "$bin" "${prom}/promtool"
      - name: Check rendered manifests
        if: steps.specs.outputs.count != '0'
        run: |
          kubeconform -strict -summary -kubernetes-version 1.36.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            $(find rendered -mindepth 1 -maxdepth 1 -type d ! -name rules)
          promtool check rules rendered/rules/*.yaml
      - name: Upload rendered manifests
        if: steps.specs.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rendered-manifests
          path: rendered/

  e2e-kind:
    needs: validate-render
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install .
      - name: Install kind, kubectl and helm
        run: |
          # Pinned versions go into a job-local directory placed first on PATH.
          # The runner image already has some of these tools in /usr/local/bin,
          # owned by root, and they cannot be replaced there.
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"
          curl -sSfLo "$bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl -sSfLo "$bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x "$bin/kind" "$bin/kubectl"
          curl -sSfL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C "$bin" linux-amd64/helm
      - name: Create test cluster with kube-prometheus-stack
        run: bash scripts/dev-cluster.sh up
      - name: Onboard every service
        run: onboardctl apply services/
      - name: Deploy demo workloads behind the specs
        run: python demo/deploy_workloads.py services/
      - name: Re-applying changes nothing
        run: |
          onboardctl apply services/
          onboardctl diff services/
      - name: Verify
        run: onboardctl verify services/ --timeout 300
      - name: DR drill
        run: onboardctl drill --yes
      - name: Upload drill report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: drill-report
          path: reports/drill-*.md
          if-no-files-found: ignore
      - name: Dump cluster state on failure
        if: failure()
        run: |
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "No cluster to inspect: it was never created or is unreachable."
            exit 0
          fi
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
      - name: Delete cluster
        if: always()
        run: bash scripts/dev-cluster.sh down
