apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: checkout-api-slo
  namespace: payments-checkout
  labels:
    app.kubernetes.io/managed-by: onboardctl
    onboardctl/service: checkout-api
    onboardctl/team: payments
  annotations:
    onboardctl/spec-hash: "7d28ca8a1a42e699"
spec:
  groups:
    - name: onboardctl.checkout-api.recording
      rules:
        - record: slo:availability_error_ratio:rate5m
          expr: |-
            sum by (namespace, job) (rate(http_requests_total{namespace="payments-checkout", job="checkout-api", code=~"5.."}[5m]))
            /
            sum by (namespace, job) (rate(http_requests_total{namespace="payments-checkout", job="checkout-api"}[5m]))
        - record: slo:availability_error_ratio:rate30m
          expr: |-
            sum by (namespace, job) (rate(http_requests_total{namespace="payments-checkout", job="checkout-api", code=~"5.."}[30m]))
            /
            sum by (namespace, job) (rate(http_requests_total{namespace="payments-checkout", job="checkout-api"}[30m]))
        - record: slo:availability_error_ratio:rate1h
          expr: |-
            sum by (namespace, job) (rate(http_requests_total{namespace="payments-checkout", job="checkout-api", code=~"5.."}[1h]))
            /
            sum by (namespace, job) (rate(http_requests_total{namespace="payments-checkout", job="checkout-api"}[1h]))
        - record: slo:availability_error_ratio:rate6h
          expr: |-
            sum by (namespace, job) (rate(http_requests_total{namespace="payments-checkout", job="checkout-api", code=~"5.."}[6h]))
            /
            sum by (namespace, job) (rate(http_requests_total{namespace="payments-checkout", job="checkout-api"}[6h]))
        - record: slo:availability_error_ratio:rate3d
          expr: |-
            sum by (namespace, job) (rate(http_requests_total{namespace="payments-checkout", job="checkout-api", code=~"5.."}[3d]))
            /
            sum by (namespace, job) (rate(http_requests_total{namespace="payments-checkout", job="checkout-api"}[3d]))
        - record: slo:latency_error_ratio:rate5m
          expr: |-
            1 - (
              sum by (namespace, job) (rate(http_request_duration_seconds_bucket{namespace="payments-checkout", job="checkout-api", le="0.25"}[5m]))
              /
              sum by (namespace, job) (rate(http_request_duration_seconds_count{namespace="payments-checkout", job="checkout-api"}[5m]))
            )
        - record: slo:latency_error_ratio:rate30m
          expr: |-
            1 - (
              sum by (namespace, job) (rate(http_request_duration_seconds_bucket{namespace="payments-checkout", job="checkout-api", le="0.25"}[30m]))
              /
              sum by (namespace, job) (rate(http_request_duration_seconds_count{namespace="payments-checkout", job="checkout-api"}[30m]))
            )
        - record: slo:latency_error_ratio:rate1h
          expr: |-
            1 - (
              sum by (namespace, job) (rate(http_request_duration_seconds_bucket{namespace="payments-checkout", job="checkout-api", le="0.25"}[1h]))
              /
              sum by (namespace, job) (rate(http_request_duration_seconds_count{namespace="payments-checkout", job="checkout-api"}[1h]))
            )
        - record: slo:latency_error_ratio:rate6h
          expr: |-
            1 - (
              sum by (namespace, job) (rate(http_request_duration_seconds_bucket{namespace="payments-checkout", job="checkout-api", le="0.25"}[6h]))
              /
              sum by (namespace, job) (rate(http_request_duration_seconds_count{namespace="payments-checkout", job="checkout-api"}[6h]))
            )
        - record: slo:latency_error_ratio:rate3d
          expr: |-
            1 - (
              sum by (namespace, job) (rate(http_request_duration_seconds_bucket{namespace="payments-checkout", job="checkout-api", le="0.25"}[3d]))
              /
              sum by (namespace, job) (rate(http_request_duration_seconds_count{namespace="payments-checkout", job="checkout-api"}[3d]))
            )
    - name: onboardctl.checkout-api.alerts
      rules:
        - alert: ErrorBudgetBurn
          expr: |-
            slo:availability_error_ratio:rate1h{namespace="payments-checkout", job="checkout-api"} > (14.4 * 0.001)
            and
            slo:availability_error_ratio:rate5m{namespace="payments-checkout", job="checkout-api"} > (14.4 * 0.001)
          labels:
            deployment: checkout-api
            long_window: "1h"
            remediation: rollout-restart
            service: checkout-api
            severity: critical
            slo: availability
            team: payments
          annotations:
            description: "SLO: 99.9% of requests succeed over 30d. The error ratio over the last 1h and 5m is above 14.4 times the budget; at this rate 2% of the 30d budget is spent within 1h."
            runbook_url: "https://runbooks.example.com/payments/checkout-api"
            summary: "checkout-api is burning its availability error budget 14.4x faster than sustainable"
        - alert: ErrorBudgetBurn
          expr: |-
            slo:availability_error_ratio:rate6h{namespace="payments-checkout", job="checkout-api"} > (6 * 0.001)
            and
            slo:availability_error_ratio:rate30m{namespace="payments-checkout", job="checkout-api"} > (6 * 0.001)
          labels:
            long_window: "6h"
            service: checkout-api
            severity: critical
            slo: availability
            team: payments
          annotations:
            description: "SLO: 99.9% of requests succeed over 30d. The error ratio over the last 6h and 30m is above 6 times the budget; at this rate 5% of the 30d budget is spent within 6h."
            runbook_url: "https://runbooks.example.com/payments/checkout-api"
            summary: "checkout-api is burning its availability error budget 6x faster than sustainable"
        - alert: ErrorBudgetBurn
          expr: |-
            slo:availability_error_ratio:rate3d{namespace="payments-checkout", job="checkout-api"} > (1 * 0.001)
            and
            slo:availability_error_ratio:rate6h{namespace="payments-checkout", job="checkout-api"} > (1 * 0.001)
          labels:
            long_window: "3d"
            service: checkout-api
            severity: warning
            slo: availability
            team: payments
          annotations:
            description: "SLO: 99.9% of requests succeed over 30d. The error ratio over the last 3d and 6h is above 1 times the budget; at this rate 10% of the 30d budget is spent within 3d."
            runbook_url: "https://runbooks.example.com/payments/checkout-api"
            summary: "checkout-api is burning its availability error budget 1x faster than sustainable"
        - alert: ErrorBudgetBurn
          expr: |-
            slo:latency_error_ratio:rate1h{namespace="payments-checkout", job="checkout-api"} > (14.4 * 0.01)
            and
            slo:latency_error_ratio:rate5m{namespace="payments-checkout", job="checkout-api"} > (14.4 * 0.01)
          labels:
            long_window: "1h"
            service: checkout-api
            severity: critical
            slo: latency
            team: payments
          annotations:
            description: "SLO: 99% of requests faster than 0.25s over 30d. The error ratio over the last 1h and 5m is above 14.4 times the budget; at this rate 2% of the 30d budget is spent within 1h."
            runbook_url: "https://runbooks.example.com/payments/checkout-api"
            summary: "checkout-api is burning its latency error budget 14.4x faster than sustainable"
        - alert: ErrorBudgetBurn
          expr: |-
            slo:latency_error_ratio:rate6h{namespace="payments-checkout", job="checkout-api"} > (6 * 0.01)
            and
            slo:latency_error_ratio:rate30m{namespace="payments-checkout", job="checkout-api"} > (6 * 0.01)
          labels:
            long_window: "6h"
            service: checkout-api
            severity: critical
            slo: latency
            team: payments
          annotations:
            description: "SLO: 99% of requests faster than 0.25s over 30d. The error ratio over the last 6h and 30m is above 6 times the budget; at this rate 5% of the 30d budget is spent within 6h."
            runbook_url: "https://runbooks.example.com/payments/checkout-api"
            summary: "checkout-api is burning its latency error budget 6x faster than sustainable"
        - alert: ErrorBudgetBurn
          expr: |-
            slo:latency_error_ratio:rate3d{namespace="payments-checkout", job="checkout-api"} > (1 * 0.01)
            and
            slo:latency_error_ratio:rate6h{namespace="payments-checkout", job="checkout-api"} > (1 * 0.01)
          labels:
            long_window: "3d"
            service: checkout-api
            severity: warning
            slo: latency
            team: payments
          annotations:
            description: "SLO: 99% of requests faster than 0.25s over 30d. The error ratio over the last 3d and 6h is above 1 times the budget; at this rate 10% of the 30d budget is spent within 3d."
            runbook_url: "https://runbooks.example.com/payments/checkout-api"
            summary: "checkout-api is burning its latency error budget 1x faster than sustainable"
        - alert: ScrapeTargetMissing
          expr: |-
            max by (namespace, job) (up{namespace="payments-checkout", job="checkout-api"}) == 0
            or
            absent(up{namespace="payments-checkout", job="checkout-api"})
          for: 5m
          labels:
            service: checkout-api
            severity: warning
            team: payments
          annotations:
            description: "No healthy scrape target for this service for 5 minutes, so its SLO rules have no data and its burn-rate alerts cannot fire."
            runbook_url: "https://runbooks.example.com/payments/checkout-api"
            summary: "Prometheus cannot scrape checkout-api"
