apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: checkout-api-responder
  namespace: payments-checkout
  labels:
    app.kubernetes.io/managed-by: onboardctl
    onboardctl/service: checkout-api
    onboardctl/team: payments
  annotations:
    onboardctl/spec-hash: "7d28ca8a1a42e699"
# Lets the remediation responder restart this one Deployment and nothing else.
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["checkout-api"]
    verbs: ["get", "patch"]
