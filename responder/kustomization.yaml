# kubectl apply -k responder/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: onboardctl-system
resources:
  - responder.yaml
# The hash suffix kustomize adds to the ConfigMap name rolls the Deployment
# whenever responder.py changes.
configMapGenerator:
  - name: onboardctl-responder
    files:
      - responder.py
