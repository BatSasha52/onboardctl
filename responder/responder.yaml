apiVersion: v1
kind: Namespace
metadata:
  name: onboardctl-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# Has no permissions of its own. Each service that opts in to remediation
# gets a Role and RoleBinding from onboardctl, in its own namespace, that
# allow get and patch on exactly one Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: onboardctl-responder
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboardctl-responder
  labels:
    app.kubernetes.io/name: onboardctl-responder
spec:
  # One replica: the lock that serialises decisions is in-process.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onboardctl-responder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onboardctl-responder
    spec:
      serviceAccountName: onboardctl-responder
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: responder
          image: python:3.13.15-slim-bookworm
          command: ["python", "/app/responder.py"]
          env:
            - name: ALERTMANAGER_URL
              value: http://kps-alertmanager.monitoring.svc:9093
            - name: COOLDOWN_SECONDS
              value: "1800"
            - name: DRY_RUN
              value: "false"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: onboardctl-responder
---
apiVersion: v1
kind: Service
metadata:
  name: onboardctl-responder
spec:
  selector:
    app.kubernetes.io/name: onboardctl-responder
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Only Alertmanager may call the webhook. Enforced only where the network
# plugin supports NetworkPolicy; the Alertmanager confirmation in
# responder.py does not depend on it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onboardctl-responder
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: onboardctl-responder
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - port: 8080
