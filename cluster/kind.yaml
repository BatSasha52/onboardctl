# Single-node kind cluster for local development and the CI end-to-end job.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
kubeadmConfigPatches:
  # Docker Desktop's WSL2 VM can still run cgroup v1, which kubelet 1.35+
  # rejects by default. This opts back in; it has no effect on cgroup v2 hosts.
  - |
    kind: KubeletConfiguration
    failCgroupV1: false
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
